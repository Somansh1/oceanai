[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI - the factory that builds, tests and ships grounded agents from a brief and a folder of documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pypdf>=4.0",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "numpy>=1.26",
    "requests>=2.31",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
ui = ["streamlit>=1.36"]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
